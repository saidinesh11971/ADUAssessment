server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/adu?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Serve the built React app as static content so the app is single-port in prod.
# Default points to ../frontend/dist/ for local dev (after `npm run build`).
spring.web.resources.static-locations=${FRONTEND_DIR:file:../frontend/dist/}

# CORS allow-list for the /api/** endpoints. Defaults to the Vite dev server.
# Override with CORS_ALLOWED_ORIGINS (comma-separated) in other environments.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging.level.com.adu.importer=INFO
